<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Großer Start</title>
<style>
:root{
  --it:0px; --ib:0px; --il:0px; --ir:0px;
  --ui:1;   /* "Größe" in the settings: everything the senior uses is scaled by it */
  --zit:calc(var(--it) / var(--ui)); --zib:calc(var(--ib) / var(--ui)); --zil:calc(var(--il) / var(--ui)); --zir:calc(var(--ir) / var(--ui));
  --tmin:130px;   /* status bar, navigation bar, sides: set by the app (setInsets) */
  --ink:#1c1c1e; --sub:#3c3c43;
  /* glass: tinted dark enough that white text stays readable on any wallpaper */
  --glass:rgba(22,24,32,.62); --glass-strong:rgba(16,18,26,.66);   /* dark enough for white text on any wallpaper (WCAG AA) */
   --glass-light:rgba(255,255,255,.1);
  --depth:0 0 #0000;   /* no drop shadows: liquid glass gets its depth from refraction and edge light */
  --wa:#17904b; --wa2:#0b5e2f; --call:#2a64d6; --call2:#143a92; --sms:#c96214; --sms2:#8f4006;
  --warn:#d92d3a; --hi:#ffd60a; --blue:#0a5bd8;
  --r-xl:34px; --r-l:26px;
  --ease:cubic-bezier(.2,.8,.2,1);
}
/* Inter: the closest open font to Apple's SF Pro (which may only be used on Apple devices); it ships with the app */
@font-face{font-family:'Inter';font-style:normal;font-weight:400 800;font-display:block;src:url(fonts/inter-latin.woff2) format('woff2');
  unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Inter';font-style:normal;font-weight:400 800;font-display:block;src:url(fonts/inter-latin-ext.woff2) format('woff2');
  unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C4,U+2113,U+2C60-2C7F,U+A720-A7FF}
*{box-sizing:border-box}
html{touch-action:pan-y}
html,body{margin:0;min-height:100%;background:transparent;color:#fff;
  font-family:Inter,"SF Pro Display",-apple-system,system-ui,Roboto,sans-serif;font-optical-sizing:auto;
  font-feature-settings:'cv11','ss03';   /* single-storey a and rounder quotes, nearer to SF */
  -webkit-font-smoothing:antialiased;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
body{overscroll-behavior:none}
/* the phone's own wallpaper shows through; a soft dark veil at the top keeps the clock readable on any picture */
body:before{content:"";position:fixed;left:0;right:0;top:0;height:65vh;z-index:-1;pointer-events:none;
  background:linear-gradient(rgba(0,0,0,.55),rgba(0,0,0,.28) 50%,rgba(0,0,0,0))}
/* a background picture of their own: shown in the page, so the glass can really bend it */
#bg{position:fixed;top:0;left:0;right:0;bottom:0;z-index:-2;background:center/cover no-repeat;display:none}
html.hasbg #bg{display:block;background-image:var(--bgimg)}
/* in a browser there is no wallpaper: a stand-in picture */
html.preview{background:radial-gradient(120% 80% at 20% 10%,#7aa3d6 0%,transparent 60%),
  radial-gradient(90% 70% at 90% 80%,#e0a77a 0%,transparent 60%),linear-gradient(160deg,#3b5b8a,#6f8f86 50%,#b98a64) fixed}
button{font:inherit;color:inherit;touch-action:manipulation;cursor:pointer;margin:0;transition:transform .18s var(--ease),filter .18s}
button:active{transform:scale(.96);filter:brightness(1.08)}

/* the glass edge: a bright rim and a soft sheen on the upper half, like light on curved glass */
.tile,.app.wa,#dock,.act,.back,#bat,#pinPad button,#toast,.chip,#hold span{position:relative;isolation:isolate}
.tile:after,.app.wa:after,#dock:after,.act:after,.back:after,#bat:after,#pinPad button:after,#toast:after,.chip:after{
  content:"";position:absolute;top:0;left:0;right:0;bottom:0;border-radius:inherit;pointer-events:none;z-index:2;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.38),inset 0 0 0 .5px rgba(255,255,255,.22)}
.tile:after{box-shadow:inset 0 1px 0 rgba(255,255,255,.3),inset 0 0 0 .5px rgba(255,255,255,.18)}
.lg:after{content:"";position:absolute;top:0;left:0;right:0;bottom:0;border-radius:inherit;pointer-events:none;z-index:2;box-shadow:none;
  background:var(--lgspec,none) 0 0/100% 100% no-repeat;opacity:.55}

/* the front page */
#home{zoom:var(--ui);padding:calc(var(--zit) + 8px) calc(var(--zir) + 16px) calc(var(--zib) + 28px) calc(var(--zil) + 16px);max-width:680px;margin:0 auto}
#top{text-align:center;padding:10px 0 20px;touch-action:none;position:relative;text-shadow:0 2px 14px rgba(0,0,0,.55),0 1px 3px rgba(0,0,0,.6)}
#date{font-size:min(calc(7vw / var(--ui)),32px);font-weight:600;letter-spacing:.01em;opacity:.97}
#time{font-size:min(calc(31vw / var(--ui)),156px);font-weight:700;line-height:.95;letter-spacing:-.045em;font-variant-numeric:tabular-nums;margin-top:2px}
#bat{display:inline-flex;align-items:center;gap:12px;margin-top:14px;font-size:min(calc(6.6vw / var(--ui)),28px);font-weight:700;padding:9px 20px 9px 16px;
  border-radius:999px;background:var(--glass);box-shadow:var(--depth);text-shadow:none}
#bat.low{background:linear-gradient(180deg,#e8434f,#b31b27)}
#bat.charging .batico i{background:#5ee08a}
.batico{width:52px;height:26px;border:3px solid currentColor;border-radius:8px;position:relative;padding:2px;flex:none}
.batico:after{content:"";position:absolute;right:-8px;top:6px;width:4px;height:8px;background:currentColor;border-radius:0 3px 3px 0}
.batico i{display:block;height:100%;background:currentColor;border-radius:4px}
#hold{position:absolute;left:50%;top:50%;width:160px;height:160px;margin:-80px 0 0 -80px;border-radius:50%;display:none;
  align-items:center;justify-content:center;text-align:center;font-size:18px;font-weight:700;color:var(--ink);pointer-events:none;z-index:5;text-shadow:none}
#hold.on{display:flex}
#hold span{background:rgba(255,255,255,.92);border-radius:50%;width:128px;height:128px;display:flex;align-items:center;justify-content:center;padding:8px}

/* family: every tile a rounded square; a face fills it, otherwise initials on a rich colour, the name on a glass strip */
#people{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--tmin),1fr));gap:16px;margin-top:16px}
#people.one{grid-template-columns:1fr}
.tile{container-type:inline-size;aspect-ratio:1/1;border:0;padding:0;border-radius:var(--r-xl);overflow:hidden;box-shadow:var(--depth);background:#2a2d38;color:#fff;display:block;text-align:center}
.av{background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;flex:none;
  text-shadow:0 2px 8px rgba(0,0,0,.25);letter-spacing:-.02em}
#people.one .tile{aspect-ratio:16/11}
.tile .av{position:absolute;top:0;left:0;right:0;bottom:0;font-size:min(46cqw,110px)}
/* no photo: the initials sit high, the name has the lower part to itself (two lines fit) */
.tile:not(.face) .av{align-items:flex-start;padding-top:9%;font-size:min(38cqw,92px)}
.tile .nm{position:absolute;left:8px;right:8px;bottom:8px;z-index:1;padding:8px 8px 9px;border-radius:calc(var(--r-xl) - 8px);
  background:var(--glass-strong);font-size:max(calc(17px / var(--ui)),min(15cqw,34px));font-weight:700;line-height:1.1;-webkit-hyphens:auto;hyphens:auto;overflow-wrap:break-word}
/* the tile's own size sets the text inside it (cqw), so names and letters fit at every size and column count */
.tile .nm{left:6cqw;right:6cqw;bottom:6cqw;padding:3cqw 3cqw 4cqw;border-radius:calc(var(--r-xl) - 6cqw)}

#apps{display:grid;grid-template-columns:1fr;gap:16px;margin-top:16px}
#apps:empty{display:none}
.app.wa{display:flex;align-items:center;justify-content:center;gap:16px;border:0;border-radius:999px;min-height:112px;padding:12px 28px;
  background:rgba(16,122,62,.8);color:#fff;font-size:min(calc(9vw / var(--ui)),40px);font-weight:700;box-shadow:var(--depth)}
.app.wa svg{width:min(64px,calc(15vw / var(--ui)));height:min(64px,calc(15vw / var(--ui)));flex:none}
/* flashlight and "Alle Apps": two glass pills side by side */
/* rows of big buttons (flashlight, Lupe, Alle Apps / helpers / check-in and help): equal widths, two per row on a
   phone; a third gets the whole next row instead of squeezing. All in one row on wide screens. */
#tools,#widgets,#care{display:flex;flex-wrap:wrap;gap:12px;margin-top:16px}
#tools .pill,#widgets .pill,#care .pill{flex:1 1 calc(50% - 6px);min-width:0}
@media (min-width:600px){ #tools .pill,#widgets .pill,#care .pill{flex:1 1 0} }
#tools.none{display:none}
.pill{position:relative;isolation:isolate;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border:0;
  border-radius:var(--r-xl);min-height:112px;padding:12px 10px;background:var(--glass);color:#fff;font-size:max(calc(17px / var(--ui)),min(calc(6vw / var(--ui)),26px));font-weight:700;line-height:1.15;text-align:center;-webkit-hyphens:auto;hyphens:auto;overflow-wrap:break-word}
.pill > span{max-width:100%}
.pill svg{width:42px;height:42px;flex:none}
.pill.on{background:rgba(255,214,10,.92);color:#1c1c1e}
/* badges, reminders card, care buttons, photo frame */
.badge{position:absolute;top:6cqw;right:6cqw;z-index:3;min-width:max(15cqw,calc(24px / var(--ui)));height:max(15cqw,calc(24px / var(--ui)));padding:0 3cqw;border-radius:999px;background:#e5222f;color:#fff;
  font-size:max(10cqw,calc(16px / var(--ui)));font-weight:800;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 2px #fff}
#pNew{display:flex;flex-direction:column;gap:8px;margin:-6px 0 14px}
.pnew{background:#e5222f;color:#fff;border-radius:999px;padding:8px 16px;font-size:min(calc(5.4vw / var(--ui)),24px);font-weight:700;text-align:center}
#meds{display:flex;flex-direction:column;gap:14px;margin-top:14px}
#meds.none,#care.none{display:none}
.medcard{position:relative;isolation:isolate;border-radius:var(--r-xl);background:rgba(255,214,10,.95);color:#1c1c1e;padding:16px;display:flex;flex-direction:column;gap:12px}
.medtxt{display:flex;align-items:center;gap:14px;font-size:max(calc(20px / var(--ui)),min(calc(7.5vw / var(--ui)),32px));font-weight:800;line-height:1.1}
.medtxt svg{width:52px;height:52px;flex:none}
.medtxt small{display:block;font-size:max(.6em,calc(16px / var(--ui)));font-weight:600}
.medok{min-height:88px;border:0;border-radius:var(--r-l);background:#107a3e;color:#fff;font-size:min(calc(8vw / var(--ui)),34px);font-weight:800}
/* a new WhatsApp message on the front page */
.wacard{position:relative;isolation:isolate;border:0;border-radius:var(--r-xl);background:rgba(16,122,62,.9);color:#fff;padding:16px 18px;text-align:left;
  display:flex;flex-direction:column;gap:6px;font-size:min(calc(6vw / var(--ui)),26px);line-height:1.25;width:100%}
.wacard b{font-size:1.15em}
.wacard span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;opacity:.95;white-space:pre-line}
#mview{zoom:var(--ui);padding:calc(var(--zit) + 14px) calc(var(--zir) + 16px) calc(var(--zib) + 16px) calc(var(--zil) + 16px);align-items:center}
#mview > :not(.vbg){width:100%;max-width:640px}
#mview h2{font-size:min(calc(9vw / var(--ui)),40px);margin:6px 0 4px;font-weight:700;text-align:center}
#mWhen{text-align:center;font-size:22px;opacity:.85;margin-bottom:12px}
#mText{background:#fff;color:#1c1c1e;border-radius:var(--r-l);padding:18px 20px;font-size:min(calc(7vw / var(--ui)),32px);line-height:1.35;white-space:pre-line;overflow-wrap:anywhere;margin-bottom:14px}
#mActs{display:flex;flex-direction:column;gap:12px;margin-bottom:14px}
#mActs .act{min-height:88px;flex:none}
#mReply textarea{width:100%;min-height:150px;border:0;border-radius:var(--r-l);padding:16px;font:inherit;font-size:30px;line-height:1.3;color:#1c1c1e;resize:vertical}
#mQuick{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0}
#mQuick button{border:0;border-radius:999px;background:rgba(255,255,255,.9);color:#1c1c1e;font-size:24px;font-weight:600;padding:14px 20px;min-height:64px}
.pill.okbtn{background:rgba(16,122,62,.85)}
.pill.done{background:var(--glass);opacity:.85}
.pill.sosbtn{background:rgba(200,30,45,.9)}
.pill.sosbtn small{display:block;font-size:max(.72em,calc(16px / var(--ui)));font-weight:600}
.sosring{position:absolute;top:8px;right:8px;width:26px;height:26px;border-radius:50%;border:2px solid rgba(255,255,255,.7)}
.pill.holding{transform:scale(.97)}
#frame{margin-top:16px}
#frame:empty{display:none}
.framebtn{display:block;width:100%;aspect-ratio:4/3;border:0;border-radius:var(--r-xl);background:#222 center/cover no-repeat}
.framenote{background:var(--glass);border-radius:var(--r-l);padding:16px;font-size:20px;text-align:center;margin:0}
/* Lupe and photo viewer: full screen, black */
#lupe,#pview{background:#000!important;zoom:1}
#lupe video{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;transform-origin:center}
.lpanel{position:absolute;left:0;right:0;bottom:0;z-index:2;display:flex;flex-direction:column;gap:10px;
  padding:14px calc(var(--ir) + 14px) calc(var(--ib) + 14px) calc(var(--il) + 14px);background:rgba(10,12,18,.9);border-radius:28px 28px 0 0}
.lrow{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:10px;align-items:center}
.lrow.two{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.lpanel button{min-height:72px;border:0;border-radius:20px;background:rgba(255,255,255,.16);color:#fff;font-size:24px;font-weight:700}
.lpanel button.on{background:rgba(255,214,10,.95);color:#1c1c1e}
#lupeM,#lupeP{font-size:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;padding:6px}
.lzb b{font-size:34px;line-height:1}
.lpanel .lclose{background:rgba(255,255,255,.26)}
#pview .pvbar button{min-height:76px;border:0;border-radius:22px;background:rgba(20,22,30,.82);color:#fff;font-size:24px;font-weight:700}
#lupeZ{min-width:92px;text-align:center;font-size:28px;font-weight:800;font-variant-numeric:tabular-nums}
#pvImg{position:absolute;top:calc(var(--it) + 50px);left:0;right:0;bottom:calc(var(--ib) + 110px);background:center/contain no-repeat}
#pvCount{position:absolute;top:calc(var(--it) + 10px);left:0;right:0;text-align:center;font-size:22px;font-weight:600}
#pview .pvbar{position:absolute;left:12px;right:12px;bottom:calc(var(--ib) + 12px);display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.pick label.chk{background:#fff;margin-bottom:6px}
.trow b{font-size:22px;min-width:96px;text-align:center}
input[type=radio]{width:30px;height:30px;flex:none;accent-color:#1e9a52}

/* helpers: alarm, kitchen timer, stopwatch */
#widgets.none{display:none}
.pill small{display:block;font-size:max(.72em,calc(16px / var(--ui)));font-weight:600;opacity:.92;margin-top:2px;font-variant-numeric:tabular-nums}
.pill.live{background:rgba(255,214,10,.92);color:#1c1c1e}
#wview{zoom:var(--ui);padding:calc(var(--zit) + 14px) calc(var(--zir) + 16px) calc(var(--zib) + 16px) calc(var(--zil) + 16px);align-items:center}
#wview > :not(.vbg){width:100%;max-width:560px}
#wview h2{font-size:min(calc(9vw / var(--ui)),40px);margin:6px 0 14px;font-weight:700;text-align:center}
#wBody{flex:1;display:flex;flex-direction:column;gap:14px}
.wbig{font-size:min(calc(24vw / var(--ui)),120px);font-weight:700;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:-.03em;line-height:1}
.wnote{font-size:21px;line-height:1.4;text-align:center;opacity:.95;margin:0}
.wbtn{min-height:84px;border:0;border-radius:var(--r-xl);font-size:min(calc(7.5vw / var(--ui)),32px);font-weight:700;color:#fff;background:var(--glass-light);position:relative;isolation:isolate}
.wbtn.go{background:rgba(16,122,62,.85)} .wbtn.stop{background:rgba(176,80,12,.88)} .wbtn.blue{background:rgba(30,80,190,.85)}
.tset{display:flex;align-items:center;justify-content:center;gap:10px}
.tcol{display:flex;flex-direction:column;align-items:center;gap:8px}
.tcol button{width:96px;height:64px;border:0;border-radius:22px;background:var(--glass-light);color:#fff;font-size:30px;position:relative;isolation:isolate}
.tcol div{font-size:min(calc(22vw / var(--ui)),104px);font-weight:700;font-variant-numeric:tabular-nums;min-width:1.25em;text-align:center;line-height:1}
.colon{font-size:min(calc(20vw / var(--ui)),90px);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.chips button{min-height:60px;padding:8px 20px;border:0;border-radius:999px;background:var(--glass-light);color:#fff;font-size:22px;font-weight:600}
.chips button[aria-pressed="true"]{background:#fff;color:#1c1c1e}
.presets{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.presets button{min-height:96px;border:0;border-radius:var(--r-l);background:var(--glass-light);color:#fff;font-size:min(calc(7vw / var(--ui)),30px);font-weight:700;line-height:1.1;position:relative;isolation:isolate}
.presets small{display:block;font-size:.7em;font-weight:600}

/* all apps: a page that slides in from the right */
#drawer{zoom:var(--ui);padding:calc(var(--zit) + 12px) calc(var(--zir) + 14px) calc(var(--zib) + 14px) calc(var(--zil) + 14px);transition:transform .32s var(--ease)}
#drawer.open{animation:slidein .32s var(--ease)}
@keyframes slidein{from{transform:translateX(100%)}to{transform:none}}
#drawer h2{font-size:min(calc(9vw / var(--ui)),40px);margin:4px 6px 14px;font-weight:700}
#dGrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px 10px;flex:1;align-content:start}
@media (min-width:600px){ #dGrid{grid-template-columns:repeat(5,minmax(0,1fr))} }
.dapp{background:none;border:0;padding:4px;display:flex;flex-direction:column;align-items:center;gap:8px;color:#fff;touch-action:pan-y;
  font-size:18px;font-weight:600;line-height:1.15;text-align:center;text-shadow:0 1px 4px rgba(0,0,0,.6)}
.dapp img,.dapp .noimg{width:min(calc(22vw / var(--ui)),92px);height:min(calc(22vw / var(--ui)),92px)}
.dapp .noimg{border-radius:28%;background:#fff;color:var(--ink);display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:700;text-shadow:none}
.dapp span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;-webkit-hyphens:auto;hyphens:auto;overflow-wrap:break-word;max-width:100%}
#drawer .back{margin-top:16px}
.hidelist label.chk{background:#fff;margin-bottom:6px}
.hidelist img{width:44px;height:44px}
/* other apps: really big icons on a glass shelf; holding one shows its name, Öffnen and Deinstallieren */
#dock{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px;padding:14px;border-radius:calc(var(--r-xl) + 8px);
  background:var(--glass-light);box-shadow:var(--depth)}
#dock.none{display:none}
.icon{position:relative;z-index:3;background:none;border:0;padding:6px;display:flex;align-items:center;justify-content:center;touch-action:pan-y}
.icon img{width:100%;max-width:160px;aspect-ratio:1/1}
.icon .noimg{width:100%;max-width:160px;aspect-ratio:1/1;border-radius:28%;background:#fff;color:var(--ink);box-shadow:var(--depth);
  display:flex;align-items:center;justify-content:center;font-size:min(calc(16vw / var(--ui)),80px);font-weight:700}
#empty{background:var(--glass-strong);border-radius:var(--r-l);padding:20px;font-size:22px;line-height:1.45;text-align:center;display:none;box-shadow:var(--depth)}

/* wide screens (an unfolded phone, a tablet) */
@media (min-width:600px){
  #home{max-width:1100px}
  :root{--tmin:190px}
  #dock{grid-template-columns:repeat(3,1fr)}
  #time{font-size:min(calc(20vw / var(--ui)),calc(25vh / var(--ui)),170px)}
}
@media (min-width:900px){ #dock{grid-template-columns:repeat(4,1fr)} }

/* one person: a contact card, then WhatsApp, call, SMS as big glass buttons */
.view{position:fixed;top:0;left:0;right:0;bottom:0;z-index:100;background:rgba(8,10,18,.62);display:none;flex-direction:column;overflow:auto;overscroll-behavior:contain}
/* while a menu is open the front page underneath stays where it is */
html.lock,html.lock body{overflow:hidden;overscroll-behavior:none}
.view:not(#setup){--ui:var(--vz,1);--zit:calc(var(--it) / var(--vz,1));--zib:calc(var(--ib) / var(--vz,1));--zil:calc(var(--il) / var(--vz,1));--zir:calc(var(--ir) / var(--vz,1))}
.view.open{display:flex;animation:rise .32s var(--ease)}
/* behind a person's buttons: the background picture, softly out of focus (the buttons' glass bends it);
   with the phone's wallpaper instead, the front page is blurred */
html:not(.hasbg) .view:not(#setup){background:rgba(8,10,18,.45)}
/* phones that can't blur the wallpaper (Android 11 and older, battery saver): a darker veil instead */
html.noblur:not(.hasbg) .view:not(#setup){background:rgba(8,10,18,.78)}
html:not(.hasbg).dim #home{filter:blur(14px) brightness(.6)}
html.sizing #home{pointer-events:none}
#sizebar{position:fixed;left:12px;right:12px;bottom:calc(var(--ib) + 12px);z-index:400;display:none;align-items:center;gap:10px;padding:12px;
  border-radius:var(--r-xl);background:rgba(20,22,30,.94);color:#fff}
html.sizing #sizebar{display:flex}
#sizebar button{flex:1;min-height:72px;border:0;border-radius:22px;background:rgba(255,255,255,.16);color:#fff;font-size:26px;font-weight:700}
#sizebar #sizeDone{background:var(--blue)}
#sizeVal{min-width:84px;text-align:center;font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
html.hasbg .view:not(#setup){background:transparent}
.vbg{position:fixed;top:0;left:0;right:0;bottom:0;z-index:-1;pointer-events:none;display:none;
  background:linear-gradient(rgba(0,0,0,.5),rgba(0,0,0,.5)),var(--bgsoft,var(--bgimg)) center/cover no-repeat}
html.hasbg .vbg{display:block}
@keyframes rise{from{opacity:0;transform:scale(1.03)}to{opacity:1;transform:none}}
#person,#pin{zoom:var(--ui);padding:calc(var(--zit) + 14px) calc(var(--zir) + 16px) calc(var(--zib) + 16px) calc(var(--zil) + 16px)}
#person{align-items:center}
#person > :not(.vbg){width:100%;max-width:640px}
#pHead{display:flex;flex-direction:column;align-items:center;gap:10px;margin:4px 0 18px;text-align:center}
#pHead .av{width:min(calc(36vw / var(--ui)),160px);height:min(calc(36vw / var(--ui)),160px);border-radius:50%;font-size:min(calc(16vw / var(--ui)),72px);
  box-shadow:0 0 0 1px rgba(255,255,255,.35),var(--depth)}
#pName{font-size:min(calc(10vw / var(--ui)),48px);font-weight:700;line-height:1.05;letter-spacing:-.01em;overflow-wrap:anywhere}
#acts{flex:1;display:flex;flex-direction:column;gap:14px;margin-bottom:14px}
.act{flex:1;min-height:100px;max-height:170px;display:flex;align-items:center;gap:20px;border:0;border-radius:var(--r-xl);
  padding:12px 22px 12px 14px;color:#fff;font-size:min(calc(9vw / var(--ui)),42px);font-weight:700;text-align:left;line-height:1.1;box-shadow:var(--depth)}
.act .chip{width:min(calc(19vw / var(--ui)),86px);height:min(calc(19vw / var(--ui)),86px);border-radius:50%;background:rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center;flex:none}
.act svg{width:58%;height:58%}
.act small{display:block;font-size:.5em;font-weight:600;margin-top:5px;opacity:.95}
.act.wa{background:rgba(16,122,62,.72)}
.act.call{background:rgba(30,80,190,.72)}
.act.wacall{background:rgba(12,104,54,.78)}
.act.wavideo{background:rgba(8,88,96,.78)}
.act.sms{background:rgba(176,80,12,.74)}
.back{min-height:80px;border:0;border-radius:999px;background:var(--glass-light);color:#fff;font-size:min(calc(8vw / var(--ui)),34px);font-weight:700;
  display:flex;align-items:center;justify-content:center;gap:12px;flex:none;box-shadow:var(--depth)}
.back svg{width:40px;height:40px}
svg.iw{display:block}
svg.i{fill:none;stroke:currentColor;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}

/* settings, for the family member who sets the phone up: calm grouped lists, like the phone's own settings */
#setup{background:#f2f2f7;padding-bottom:var(--ib);color:var(--ink);font-size:20px;line-height:1.4}
#setup .bar{position:sticky;top:0;z-index:2;background:#f2f2f7;
  border-bottom:1px solid rgba(60,60,67,.25);padding:calc(var(--it) + 10px) calc(var(--ir) + 16px) 10px calc(var(--il) + 16px);
  display:flex;align-items:center;justify-content:space-between;gap:10px}
#setup .bar h2{margin:0;font-size:30px;font-weight:700;letter-spacing:-.01em}
#sBody{padding:4px calc(var(--ir) + 16px) 40px calc(var(--il) + 16px);max-width:760px;width:100%;margin:0 auto}
#sBody h3{font-size:17px;text-transform:uppercase;letter-spacing:.04em;color:#4a4a50;font-weight:600;margin:28px 6px 8px}

.note{color:var(--sub);font-size:18px}
.ok{background:#fff;border-radius:18px;padding:14px 16px;box-shadow:inset 4px 0 0 #1e9a52}
.warnbox{background:#fff;border-radius:18px;padding:14px 16px;box-shadow:inset 4px 0 0 #c98a00}
.btn{border:0;border-radius:999px;background:#fff;color:var(--blue);font-weight:600;font-size:19px;padding:10px 20px;min-height:52px;
  box-shadow:0 0 0 1.5px rgba(10,91,216,.35)}
.btn.pri{background:var(--blue);color:#fff;box-shadow:none}
.btn.danger{background:var(--warn);color:#fff;box-shadow:none}
.btn.sq{min-width:52px;padding:0 8px;color:var(--ink);box-shadow:0 0 0 1.5px rgba(60,60,67,.3)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:10px 0}
.item{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:12px 14px;border-radius:18px;margin-bottom:8px;background:#fff}
.item .av{width:58px;height:58px;border-radius:50%;font-size:24px}
.item img{width:50px;height:50px;flex:none}
.item .tx{flex:1;min-width:0;overflow-wrap:anywhere}
.item b{display:block;font-size:21px;font-weight:600}
.item span{color:var(--sub);font-size:17px;white-space:pre-line}
.item .row{margin:0;gap:8px;width:100%;justify-content:flex-end}
.item.compact{flex-wrap:nowrap;min-height:68px}
.item.compact .row{width:auto}
.lockrow{box-shadow:inset 4px 0 0 var(--blue)}
.bgprev{width:110px;height:180px;border-radius:18px;background:#ccc center/cover no-repeat;flex:none}
label.chk{display:flex;align-items:center;gap:14px;min-height:56px;background:#fff;border-radius:18px;padding:6px 16px;margin-bottom:8px}
input[type=checkbox]{width:30px;height:30px;flex:none;accent-color:#1e9a52}
input[type=text],input[type=tel]{font:inherit;font-size:22px;padding:12px 14px;border:1.5px solid rgba(60,60,67,.35);border-radius:14px;width:100%;
  -webkit-user-select:text;user-select:text;background:#fff;color:var(--ink)}
input:focus{outline:3px solid rgba(10,91,216,.5);outline-offset:1px}
.field{margin:12px 0}
.field label{display:block;font-weight:600;margin-bottom:6px}

/* dialogs: a light frosted sheet */
#dlg{position:fixed;top:0;left:0;right:0;bottom:0;z-index:300;background:rgba(0,0,0,.6);
  display:none;align-items:center;justify-content:center;padding:calc(var(--it) + 12px) 12px calc(var(--ib) + 12px)}
#dlg.open{display:flex;animation:fade .2s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
#dlg .panel{background:#f8f8fc;
  color:var(--ink);border-radius:30px;padding:20px;width:min(620px,100%);box-shadow:inset 0 1px 0 #fff;
  max-height:calc(100vh - 24px - var(--it) - var(--ib));overflow:auto;font-size:20px;line-height:1.4;animation:pop .28s var(--ease)}
@keyframes pop{from{transform:scale(.94);opacity:.4}to{transform:none;opacity:1}}
#dlg h2{margin:0 0 12px;font-size:27px;font-weight:700}
#dlg .item{background:none;padding:0}
.applist button{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:#fff;border:0;border-radius:16px;
  padding:10px 12px;margin-bottom:6px;font-size:20px;font-weight:500;color:var(--ink);min-height:64px}
.applist img{width:46px;height:46px}
/* the menu when an app is held */
#dlg .menu{text-align:center}
#dlg .menu img{width:124px;height:124px;margin:6px auto 8px;display:block}
#dlg .menu h2{font-size:31px;line-height:1.15;margin:0 0 18px;overflow-wrap:anywhere}
#dlg .menu .btn{display:block;width:100%;min-height:76px;font-size:27px;font-weight:700;margin-top:12px}

/* PIN: round glass keys */
#pin{z-index:250;align-items:center;justify-content:center}
#pin h2{font-size:30px;font-weight:600;margin:0 0 10px;text-align:center}
#pinDots{font-size:40px;letter-spacing:14px;height:60px;text-align:center}
#pinDots.bad{animation:shake .4s;color:#ff8a8a}
#pinPad{display:grid;grid-template-columns:repeat(3,auto);justify-content:center;gap:18px min(26px,4vw)}
#pinPad button{width:min(84px,calc((100vw / var(--vz,1) - 32px - 2 * min(26px,4vw)) / 3));height:auto;aspect-ratio:1/1;border:0;border-radius:50%;background:var(--glass-light);font-size:36px;font-weight:500;color:#fff}
#pinCancel{margin-top:22px;width:min(340px,100%)}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}

#toast{position:fixed;left:50%;bottom:calc(var(--ib) + 26px);transform:translate(-50%,30px);opacity:0;pointer-events:none;z-index:1000;
  background:rgba(20,22,30,.94);color:#fff;border-radius:999px;padding:16px 28px;
  font-size:25px;font-weight:600;line-height:1.3;text-align:center;width:max-content;max-width:90vw;box-shadow:var(--depth);
  transition:opacity .25s,transform .3s var(--ease)}
#toast.show{opacity:1;transform:translate(-50%,0)}

@media (prefers-reduced-motion:reduce){ *{animation:none!important;transition:none!important} }

</div>

<script>

const $ = s => document.querySelector(s);

const ICON = {

    '<path fill="#0f7a3d" transform="translate(6.2 5.7) scale(.5)" d="M20 15.4c-1.2 0-2.4-.2-3.5-.6a1 1 0 0 0-1 .2l-1.6 2c-2.8-1.4-5.5-3.9-6.9-6.8l2-1.7c.3-.3.4-.7.2-1-.4-1.1-.6-2.3-.6-3.5 0-.6-.4-1-1-1H4.2C3.6 3 3 3.2 3 4c0 9.3 7.7 17 17 17 .7 0 1-.6 1-1.2v-3.4c0-.6-.4-1-1-1z"/></svg>',
  call: '<svg class="i" viewBox="0 0 24 24"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></svg>',
  sms: '<svg class="i" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/><path d="M7 8h10M7 12h6"/></svg>',
  video: '<svg class="i" viewBox="0 0 24 24"><rect x="2" y="6" width="14" height="12" rx="2.5"/><path d="M16 10.5l6-3.5v10l-6-3.5z"/></svg>',

  speak: '<svg class="i" viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>',
  done: '<svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.6 2.6L16 9.5"/></svg>',
  open: '<svg class="i" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>'
};
const DAYS = ['Sonntag', 'Montag', 'Dienstag', 'Mittwoch', 'Donnerstag', 'Freitag', 'Samstag'];
const MONTHS = ['Januar', 'Februar', 'März', 'April', 'Mai', 'Juni', 'Juli', 'August', 'September', 'Oktober', 'November', 'Dezember'];

/* ---------- glass edges ----------
   (The refraction below is kept for reference but no longer applied: too slow on big screens. Only the rim is used.)
   Real refraction, as in https://kube.io/blog/liquid-glass-css-svg/ : every glass shape gets an SVG filter that bends
   what is behind it (backdrop-filter: url(#…), which Android's WebView supports). The rim of the glass is a convex
   squircle; light passing through it is refracted (Snell's law, glass 1.5), and how far each point moves is drawn
   into a displacement map (red = x, green = y, 128 = none). A second picture is the specular rim, both as in kube's write-up.
   Only the page's own content can be bent, so the background picture lives in the page (#bg). */
const LG = (function () {
  const NS = 'http://www.w3.org/2000/svg';
  const RES = 0.5;                 // maps at half resolution; the filter stretches them smoothly
  const ok = (() => { try { return CSS.supports('backdrop-filter', 'url(#x)') || CSS.supports('-webkit-backdrop-filter', 'url(#x)'); } catch (e) { return false; } })();
  let defs = null, seq = 0;
  const filters = new Map();       // "w|h|r|bezel" -> filter id
  const sizeOf = new WeakMap();

  // how far light is bent, from the outer edge (d = 0) to where the rim meets the flat middle (d = 1), largest = 1
  const PROFILE = (() => {
    const f = x => Math.pow(1 - Math.pow(1 - x, 4), 0.25);   // convex squircle
    const out = []; let max = 0;
    for (let i = 0; i < 128; i++) {
      const d = Math.min(0.999, Math.max(0.001, i / 127)), e = 0.001;
      const slope = (f(d + e) - f(d - e)) / (2 * e);
      const t1 = Math.atan(slope), t2 = Math.asin(Math.sin(t1) / 1.5);
      const m = (0.25 + f(d)) * Math.tan(t1 - t2);
      out.push(m); if (m > max) max = m;
    }
    return out.map(m => m / max);
  })();

  // the outward normal at (px, py) and how far in from the edge it is, for a rounded rectangle w × h with corner r
  function shape(px, py, w, h, r) {
    const qx = Math.abs(px - w / 2) - (w / 2 - r), qy = Math.abs(py - h / 2) - (h / 2 - r);
    const ox = Math.max(qx, 0), oy = Math.max(qy, 0), out = Math.hypot(ox, oy);
    const t = -(out + Math.min(Math.max(qx, qy), 0) - r);
    let nx, ny;
    if (qx > 0 && qy > 0) { nx = ox / out; ny = oy / out; } else if (qx > qy) { nx = 1; ny = 0; } else { nx = 0; ny = 1; }
    return { t, nx: px < w / 2 ? -nx : nx, ny: py < h / 2 ? -ny : ny };
  }

  /** the displacement map: inside the rim every point looks inward, by the refraction profile */
  function dispMap(w, h, r, bz) {
    const W = Math.max(2, Math.round(w * RES)), H = Math.max(2, Math.round(h * RES));
    const c = document.createElement('canvas'); c.width = W; c.height = H;
    const cx = c.getContext('2d'), D = cx.createImageData(W, H), dd = D.data;
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      const i = (y * W + x) * 4, s = shape((x + 0.5) / RES, (y + 0.5) / RES, w, h, r);
      dd[i] = dd[i + 1] = dd[i + 2] = 128; dd[i + 3] = 255;
      if (s.t <= 0 || s.t >= bz) continue;
      const m = PROFILE[Math.round(s.t / bz * 127)];
      dd[i] = 128 - s.nx * m * 127; dd[i + 1] = 128 - s.ny * m * 127;
    }
    cx.putImageData(D, 0, 0);
    return c.toDataURL();
  }

  /** the specular map (kube's rim light): a fine ring at the very edge, bright where the edge faces the light
      (upper left, -60°) and on the opposite side, fading out in between. Sharp, so drawn at twice the size. */
  const LIGHT = { x: Math.cos(-120 * Math.PI / 180), y: Math.sin(-120 * Math.PI / 180) };
  function specMap(w, h, r) {

}
/** a WhatsApp call in one tap; if WhatsApp has no call for this number, its chat opens, with the hint where to tap */
function waCall(p, video) {
  toast(p.name + ' wird über WhatsApp angerufen …');
  if (A.waCall(p.number, video)) return;
  if (A.whatsapp(waNumber(p.number))) toast('Bitte in WhatsApp oben auf ' + (video ? 'die Kamera' : 'den Hörer') + ' tippen.');

/** WhatsApp wants the number with its country code and nothing else: 0171 … → 49171 … */
function waNumber(n) {
  let s = String(n).replace(/[^\d+]/g, '');
  if (s.startsWith('+')) return s.slice(1).replace(/\D/g, '');
  if (s.startsWith('00')) return s.slice(2);
  if (s.startsWith('0')) return String(C.country).replace(/\D/g, '') + s.slice(1);
  return s;
}

/* ---------- the way into the settings: hold the clock for 4 seconds ---------- */
const HOLD = 4000, SHOW = 700;
let holdStart = 0, holdT = 0;
function holdLoop() {
  const t = performance.now() - holdStart, h = $('#hold');
  if (t > SHOW) {
    h.classList.add('on');
    const f = Math.min(1, (t - SHOW) / (HOLD - SHOW));
    h.style.background = 'conic-gradient(var(--hi) ' + (f * 360) + 'deg, rgba(255,255,255,.25) 0)';
  }
  if (t >= HOLD) { holdStop(); enterSetup(); }
}
function holdStop() { clearInterval(holdT); holdStart = 0; $('#hold').classList.remove('on'); }
$('#top').addEventListener('pointerdown', e => { clearInterval(holdT); holdStart = performance.now(); holdT = setInterval(holdLoop, 40); });
['pointerup', 'pointercancel', 'pointerleave'].forEach(n => $('#top').addEventListener(n, holdStop));
$('#top').addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('contextmenu', e => { if (!e.target.closest('input')) e.preventDefault(); });

function enterSetup() {

/* ---------- PIN pad ---------- */
let pinMode = '', pinVal = '', pinFirst = '', pinDone = null;
(function buildPad() {
  const pad = $('#pinPad');
  ['1', '2', '3', '4', '5', '6', '7', '8', '9', '', '0', '⌫'].forEach(k => {
    const b = el('button', 'lg', k);
    if (!k) b.style.visibility = 'hidden';
    if (k === '⌫') b.setAttribute('aria-label', 'Löschen');
    b.onclick = () => pinKey(k);
    pad.append(b);
  });
})();
function openPin(mode, done) {
  pinMode = mode; pinVal = ''; pinFirst = ''; pinDone = done;
  $('#pinTitle').textContent = mode === 'check' ? 'PIN eingeben' : 'Neue PIN (4 Ziffern)';
  pinShow(); $('#pin').classList.add('open');
}
function closePin() { $('#pin').classList.remove('open'); }
function pinShow() { $('#pinDots').textContent = '●'.repeat(pinVal.length) + '○'.repeat(4 - pinVal.length); }
function pinBad() { const d = $('#pinDots'); d.classList.remove('bad'); void d.offsetWidth; d.classList.add('bad'); if (navigator.vibrate) navigator.vibrate([60, 60, 60]); }
function pinKey(k) {
  if (k === '⌫') { pinVal = pinVal.slice(0, -1); return pinShow(); }
  if (pinVal.length >= 4) return;
  pinVal += k; pinShow();
  if (pinVal.length < 4) return;
  setTimeout(() => {
    if (pinMode === 'check') {
      if (pinVal === C.pin) { closePin(); pinDone(); } else { pinVal = ''; pinShow(); pinBad(); }
    } else if (!pinFirst) {
      pinFirst = pinVal; pinVal = ''; $('#pinTitle').textContent = 'PIN noch einmal'; pinShow();
    } else if (pinVal === pinFirst) {
      closePin(); pinDone(pinVal);
    } else {
      pinFirst = ''; pinVal = ''; $('#pinTitle').textContent = 'Nicht gleich – neue PIN'; pinShow(); pinBad();
    }
  }, 150);
}
$('#pinCancel').onclick = closePin;

$('#setup').addEventListener('change', e => {

    return;
  }
  const o = e.target.dataset && e.target.dataset.opt;
  if (o) {
    C[o] = e.target.checked; save(); renderHome(); renderSetup();
    if (o === 'badges' && C.badges && !A.has('calllog')) A.ask('calllog');
    if (o === 'frame' && C.frame && !A.has('photos')) { pendingAfterPerm = () => { renderHome(true); }; A.ask('photos'); }
    if (o === 'frameWA') loadPhotos();
    if (o === 'lupe' && C.lupe && !A.has('camera')) A.ask('camera');
    if ((o === 'waCalls' || o === 'waMsgs') && C[o] && !A.notesOn()) A.notesAccess();

$('#setup').addEventListener('click', e => {

  const i = +b.dataset.i, listEl = b.closest('[data-list]'), list = listEl ? C[listEl.dataset.list] : null;
  const move = d => { if (C.locked) return; const [x] = list.splice(i, 1); list.splice(i + d, 0, x); save(); renderSetup(); renderHome(); };
  switch (b.dataset.act) {

// the swipe: right to left on the front page opens the list, left to right in the list closes it
let sw = null, swallow = 0;
document.addEventListener('pointerdown', e => { sw = { x: e.clientX, y: e.clientY, t: Date.now() }; }, true);
document.addEventListener('pointerup', e => {
  if (!sw) return;
  const dx = e.clientX - sw.x, dy = e.clientY - sw.y, quick = Date.now() - sw.t < 700;
  sw = null;
  if (!quick || Math.abs(dx) < 80 || Math.abs(dy) > Math.abs(dx) * 0.6) return;
  const drawer = $('#drawer').classList.contains('open');
  const front = !document.querySelector('.view.open') && !$('#dlg').classList.contains('open');
  if (dx < 0 && front && C.drawer) { swallow = Date.now(); openDrawer(); }
  else if (dx > 0 && drawer && !$('#dlg').classList.contains('open')) { swallow = Date.now(); closeDrawer(); }
}, true);
// a swipe that started on a tile must not also open it
document.addEventListener('click', e => { if (Date.now() - swallow < 400) { e.stopPropagation(); e.preventDefault(); } }, true);

/* ---------- helpers: alarm (Wecker), kitchen timer (Kurzzeitwecker), stopwatch (Stoppuhr) ----------
   The alarm and the timer are set in the phone's own clock app (without showing it): that one rings reliably, also
   locked and with this app closed. The stopwatch counts here, from a saved start time, so it runs on while away. */
const ICON_ALARM = '<svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M5 3 2 6M19 3l3 3"/></svg>';
const ICON_TIMER = '<svg class="i" viewBox="0 0 24 24"><path d="M6 2h12M6 22h12M7 2c0 5 10 5 10 10S7 17 7 22M17 2c0 5-10 5-10 10s10 5 10 10"/></svg>';
const ICON_SW = '<svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="14" r="8"/><path d="M12 14V10M10 2h4M12 2v4M19 6l1.5-1.5"/></svg>';
const DSHORT = ['So', 'Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa'];
const pad2 = n => String(n).padStart(2, '0');
function swMs() { return C.sw.acc + (C.sw.start ? Date.now() - C.sw.start : 0); }
function fmtSw(ms, tenths) {
  const t = Math.floor(ms / 100), s = Math.floor(t / 10), m = Math.floor(s / 60), h = Math.floor(m / 60);
  return (h ? h + ':' + pad2(m % 60) : m) + ':' + pad2(s % 60) + (tenths ? ',' + (t % 10) : '');
}
function timerLeft() { return Math.max(0, C.timerEnd - Date.now()); }
function fmtLeft(ms) { const s = Math.ceil(ms / 1000), m = Math.floor(s / 60); return (m >= 60 ? Math.floor(m / 60) + ':' + pad2(m % 60) : m) + ':' + pad2(s % 60); }
function nextAlarmText() {
  let t = 0; try { t = +A.nextAlarm(); } catch (e) {}
  if (!t) return 'Kein Wecker';
  const d = new Date(t), today = new Date(), tomorrow = new Date(Date.now() + 864e5);
  const day = d.toDateString() === today.toDateString() ? 'Heute' : d.toDateString() === tomorrow.toDateString() ? 'Morgen' : DSHORT[d.getDay()];
  return day + ' ' + d.getHours() + ':' + pad2(d.getMinutes());
}

function renderWidgets() {
  const w = $('#widgets'); w.textContent = '';
  const add = (id, icon, title, fn) => {
    const b = el('button', 'pill lg'); b.id = id;
    b.innerHTML = icon + '<span>' + title + '<small></small></span>';
    b.onclick = fn; w.append(b);
  };
  if (C.wAlarm) add('wgAlarm', ICON_ALARM, 'Wecker', () => openWidget('alarm'));
  if (C.wTimer) add('wgTimer', ICON_TIMER, 'Kurzzeit&shy;wecker', () => openWidget('timer'));
  if (C.wSw) add('wgSw', ICON_SW, 'Stoppuhr', () => openWidget('sw'));
  w.classList.toggle('none', !w.children.length);
  liveWidgets(true);
}
/** the small live texts on the widgets (every second), and the open helper's big numbers */
let lastAlarmCheck = 0;
window.liveWidgets = function (all) {
  const set = (id, txt, live) => { const b = $('#' + id); if (!b) return; const sm = b.querySelector('small'); if (sm.textContent !== txt) sm.textContent = txt; b.classList.toggle('live', !!live); };
  if (C.wAlarm && (all || Date.now() - lastAlarmCheck > 30000)) { lastAlarmCheck = Date.now(); set('wgAlarm', nextAlarmText()); }
  if (C.wTimer) { const l = timerLeft(); set('wgTimer', l ? fmtLeft(l) : '', !!l); }
  if (C.wSw) set('wgSw', swMs() ? fmtSw(swMs()) : '', !!C.sw.start);
  if ($('#wview').classList.contains('open')) {
    if (wKind === 'timer' && $('#tLeft')) { const l = timerLeft(); $('#tLeft').textContent = fmtLeft(l); if (!l) setTimeout(() => wKind === 'timer' && drawWidget(), 1200); }
  }
};

let wKind = '', swRaf = 0, aH = 7, aM = 0, aLabel = '', aDaily = true;
function openWidget(kind) {
  wKind = kind;
  if (kind === 'alarm') { const d = new Date(); aH = d.getHours() < 12 ? 7 : d.getHours() + 1; aH %= 24; aM = 0; aLabel = ''; aDaily = true; }
  drawWidget();
  $('#wview').classList.add('open'); $('#wview').scrollTop = 0;
  LG.scan($('#wview'));
}
function closeWidget() { $('#wview').classList.remove('open'); wKind = ''; cancelAnimationFrame(swRaf); clearInterval(swRaf); liveWidgets(true); }
$('#wBack').onclick = closeWidget;

function drawWidget() {
  const b = $('#wBody');
  if (wKind === 'alarm') {
    $('#wTitle').textContent = 'Wecker';
    b.innerHTML =
      '<div class="tset"><div class="tcol"><button data-t="h+" aria-label="Stunde später">▲</button><div id="aH"></div><button data-t="h-" aria-label="Stunde früher">▼</button></div>' +
      '<div class="colon">:</div><div class="tcol"><button data-t="m+" aria-label="5 Minuten später">▲</button><div id="aM"></div><button data-t="m-" aria-label="5 Minuten früher">▼</button></div></div>' +
      '<div class="chips" id="aDays"><button data-d="1">Jeden Tag</button><button data-d="0">Nur einmal</button></div>' +
      '<div class="chips" id="aLbl"><button data-l="">Ohne Text</button><button data-l="Aufstehen">Aufstehen</button><button data-l="Tabletten nehmen">Tabletten</button><button data-l="Termin">Termin</button></div>' +
      '<button class="wbtn go lg" id="aSet">Wecker stellen</button>' +
      '<p class="wnote">Nächster Wecker: <b id="aNext"></b></p>' +
      '<button class="wbtn lg" id="aAll">Alle Wecker ansehen</button>';
    const show = () => {
      $('#aH').textContent = aH; $('#aM').textContent = pad2(aM); $('#aNext').textContent = nextAlarmText();
      b.querySelectorAll('#aDays button').forEach(x => x.setAttribute('aria-pressed', (x.dataset.d === '1') === aDaily));
      b.querySelectorAll('#aLbl button').forEach(x => x.setAttribute('aria-pressed', x.dataset.l === aLabel));
    };
    b.querySelectorAll('[data-t]').forEach(x => x.onclick = () => {
      const t = x.dataset.t;
      if (t === 'h+') aH = (aH + 1) % 24; else if (t === 'h-') aH = (aH + 23) % 24;
      else if (t === 'm+') aM = (aM + 5) % 60; else aM = (aM + 55) % 60;
      if (navigator.vibrate) navigator.vibrate(15);
      show();
    });
    b.querySelectorAll('#aDays button').forEach(x => x.onclick = () => { aDaily = x.dataset.d === '1'; show(); });
    b.querySelectorAll('#aLbl button').forEach(x => x.onclick = () => { aLabel = x.dataset.l; show(); });
    $('#aSet').onclick = () => {
      if (A.setAlarm(aH, aM, aLabel, aDaily)) {
        say('Wecker gestellt auf ' + aH + ' Uhr ' + (aM || ''));
        toast('Wecker: ' + aH + ':' + pad2(aM) + (aDaily ? ', jeden Tag' : ''));
        setTimeout(() => { lastAlarmCheck = 0; show(); liveWidgets(true); }, 1500);
      } else toast('Die Uhr-App ließ sich nicht erreichen.');
    };
    $('#aAll').onclick = () => A.showAlarms();
    show();
  } else if (wKind === 'timer') {
    $('#wTitle').textContent = 'Kurzzeitwecker';
    const l = timerLeft();
    if (l) {
      b.innerHTML = '<div class="wbig" id="tLeft">' + fmtLeft(l) + '</div>' +
        '<p class="wnote">Das Handy klingelt, wenn die Zeit um ist. Auch wenn diese Seite zu ist.</p>' +
        '<button class="wbtn stop lg" id="tStop">Anhalten …</button>';
      $('#tStop').onclick = () => { C.timerEnd = 0; save(); A.showTimers(); toast('In der Uhr-App den Kurzzeitwecker anhalten'); };
    } else {
      b.innerHTML = '<p class="wnote">Wie lange? Ein Tipp startet ihn.</p><div class="presets">' +
        [1, 3, 5, 10, 15, 20, 30, 45, 60].map(m => '<button class="lg" data-m="' + m + '">' + m + '<small>' + (m === 1 ? 'Minute' : 'Minuten') + '</small></button>').join('') + '</div>';
      b.querySelectorAll('[data-m]').forEach(x => x.onclick = () => {
        const m = +x.dataset.m;
        if (!A.setTimer(m * 60, 'Kurzzeitwecker')) return toast('Die Uhr-App ließ sich nicht erreichen.');
        C.timerEnd = Date.now() + m * 60000; C.timerLen = m; save();
        say('Kurzzeitwecker ' + m + (m === 1 ? ' Minute' : ' Minuten'));
        drawWidget(); liveWidgets(true); LG.scan($('#wview'));
      });
    }
  } else if (wKind === 'sw') {
    $('#wTitle').textContent = 'Stoppuhr';
    const run = !!C.sw.start;
    b.innerHTML = '<div class="wbig" id="swT">' + fmtSw(swMs(), true) + '</div>' +
      '<button class="wbtn ' + (run ? 'stop' : 'go') + ' lg" id="swGo">' + (run ? 'Anhalten' : (swMs() ? 'Weiter' : 'Starten')) + '</button>' +
      (swMs() && !run ? '<button class="wbtn lg" id="swReset">Auf Null</button>' : '');
    $('#swGo').onclick = () => {
      if (C.sw.start) { C.sw.acc += Date.now() - C.sw.start; C.sw.start = 0; } else C.sw.start = Date.now();
      if (navigator.vibrate) navigator.vibrate(30);
      save(); drawWidget(); LG.scan($('#wview')); liveWidgets(true);
    };
    if ($('#swReset')) $('#swReset').onclick = () => { C.sw = { acc: 0, start: 0 }; save(); drawWidget(); LG.scan($('#wview')); liveWidgets(true); };
    clearInterval(swRaf);
    if (run) swRaf = setInterval(() => { const e = $('#swT'); if (e) e.textContent = fmtSw(swMs(), true); }, 100);
  }
}

/* ---------- size ("Größe"): a factor for everything the senior uses; setup steps aside so it can be seen ---------- */
const SIZES = [0.6, 0.7, 0.8, 0.9, 1, 1.1, 1.2, 1.3, 1.4, 1.5];
function applySize() {
  document.documentElement.style.setProperty('--ui', C.ui);
  document.documentElement.style.setProperty('--vz', Math.max(1, C.ui));
  $('#sizeVal').textContent = Math.round(C.ui * 100) + ' %';
}
function startSizing() { closeSetup(); window.scrollTo(0, 0); document.documentElement.classList.add('sizing'); applySize(); }
function endSizing() { document.documentElement.classList.remove('sizing'); save(); openSetup(); }
$('#sizebar').querySelectorAll('[data-s]').forEach(b => b.onclick = () => {
  let i = SIZES.findIndex(x => Math.abs(x - C.ui) < 0.01); if (i < 0) i = 4;
  C.ui = SIZES[Math.max(0, Math.min(SIZES.length - 1, i + +b.dataset.s))];
  if (navigator.vibrate) navigator.vibrate(15);
  applySize();
});
$('#sizeDone').onclick = endSizing;

/* the front page is blurred while a person, the app list or a helper is open (see html.dim in the styles) */
let blurred = null;
new MutationObserver(() => {
  const root = document.documentElement;
  const open = ['#person', '#drawer', '#wview', '#pin', '#mview'].some(q => $(q).classList.contains('open'));
  root.classList.toggle('dim', open);
  // any menu at all (also the settings, Lupe, photos): the page underneath must not scroll along
  root.classList.toggle('lock', !!document.querySelector('.view.open'));
  // the phone's own wallpaper is blurred by Android itself (it can't be read by the app); with a photo of our own
  // the blurred copy behind the menu already covers everything
  const want = open && !root.classList.contains('hasbg');
  if (want !== blurred && A.blurBehind) { blurred = want; A.blurBehind(want); }
}).observe(document.body, { subtree: true, attributes: true, attributeFilter: ['class'] });

/* ======================================================================================================
   More help for everyday use (all optional, switched on in the settings):
   badges (missed calls, unread WhatsApp), reading messages aloud, reminders ("Erinnerungen"), Lupe, Bilderrahmen,
   the big call screen, and behind "Erweiterte Betreuung" what contacts the family by itself: "Mir geht's gut",
   the SOS ("Hilfe") and a note about a reminder that wasn't confirmed.
   ====================================================================================================== */

/* ---------- badges on the family tiles ---------- */
let badgeData = {};
function updateBadges() {
  if (!C.badges) { badgeData = {}; document.querySelectorAll('.badge').forEach(b => b.remove()); return; }
  try { badgeData = JSON.parse(A.badges(JSON.stringify(C.people.map(p => ({ id: p.id, number: p.number, name: p.name, contact: p.contact || '', seen: p.seen || 0 }))))); } catch (e) { badgeData = {}; }
  document.querySelectorAll('#people .tile').forEach(t => {
    const d = badgeData[t.dataset.id], n = d ? d.calls + d.wa : 0;
    let b = t.querySelector('.badge');
    if (!n) { if (b) b.remove(); return; }
    if (!b) { b = el('span', 'badge'); t.append(b); }
    b.textContent = n > 9 ? '9+' : n;
    b.setAttribute('aria-label', (d.calls ? d.calls + ' verpasste Anrufe ' : '') + (d.wa ? d.wa + ' neue Nachrichten' : ''));
  });
}
function badgeLines(p) {
  const d = badgeData[p.id]; if (!d) return '';
  return (d.calls ? '<div class="pnew">' + d.calls + (d.calls === 1 ? ' verpasster Anruf' : ' verpasste Anrufe') + '</div>' : '') +
    (d.wa ? '<div class="pnew">' + d.wa + (d.wa === 1 ? ' neue WhatsApp-Nachricht' : ' neue WhatsApp-Nachrichten') + '</div>' : '');
}

/* ---------- reminders card and the care buttons on the front page ---------- */
let careSt = { pending: [], checkedIn: false };
function readCare() { try { careSt = JSON.parse(A.careState()); } catch (e) { careSt = { pending: [], checkedIn: false }; } }
const ICON_PILL = '<svg class="i" viewBox="0 0 24 24"><rect x="2.5" y="8" width="19" height="8" rx="4" transform="rotate(-35 12 12)"/><path d="M9.2 7.9l5.6 8.2"/></svg>';
const ICON_OK = '<svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.6 2.6L16 9.5"/></svg>';
const ICON_SOS = '<svg class="i" viewBox="0 0 24 24"><path d="M12 3l9.5 17h-19z"/><path d="M12 10v4.5M12 17.3v.2"/></svg>';
function renderMeds() {

/* ---------- new WhatsApp messages: a big card, then a big page to read and answer ---------- */
let waMsgs = [], curMsg = null;
function waCards(box) {
  waMsgs = [];
  if (!C.waMsgs || !A.hasWhatsApp() || !A.notesOn()) return;
  try { waMsgs = JSON.parse(A.waMessages(C.waMsgsFamily !== false)); } catch (e) { waMsgs = []; }
  for (const m of waMsgs.slice(0, 3)) {
    const c = el('button', 'wacard lg');
    c.innerHTML = '<b>Nachricht von ' + esc(m.who) + '</b><span>' + esc(m.text) + '</span>';
    c.onclick = () => openMsg(m);
    box.append(c);
  }
  // the message was read in WhatsApp meanwhile: the page shows the newest text, or closes if nobody is answering
  if (curMsg) {
    const now = waMsgs.find(m => m.key === curMsg.key);
    if (now) { curMsg = now; $('#mText').textContent = now.text; }
    else if ($('#mReply').hidden) closeMsg();
  }
}
function timeAgo(t) {
  const d = new Date(t), now = new Date(), min = Math.round((now - d) / 60000);
  if (min < 1) return 'gerade eben';
  if (min < 60) return 'vor ' + min + (min === 1 ? ' Minute' : ' Minuten');
  return (d.toDateString() === now.toDateString() ? 'heute' : DAYS[d.getDay()]) + ', ' + d.getHours() + ':' + pad2(d.getMinutes()) + ' Uhr';
}
function openMsg(m) {

}
function msgActs() {

    add('call', ICON.speak, 'Vorlesen', '', () => A.speak('Nachricht von ' + m.who + ': ' + m.text));
    if (m.reply) add('wa', ICON.wa, 'Antworten', 'Schreiben oder sprechen', () => { $('#mReply').hidden = false; msgActs(); quick(); setTimeout(() => $('#mTa').focus(), 50); });
    add('wacall', ICON.done, 'Gelesen', 'Die Nachricht weglegen', () => { A.waRead(m.key); toast('Erledigt.'); closeMsg(); setTimeout(refreshCare, 600); });
    add('sms', ICON.open, 'In WhatsApp öffnen', '', () => { const k = m.key; closeMsg(); launch(() => A.waOpen(k), 'WhatsApp wird geöffnet …', 'WhatsApp ließ sich nicht öffnen.'); });
  } else {

function quick() {

function sendReply() {

}
window.onHeard = function (t) {

};
function closeMsg() { $('#mview').classList.remove('open'); curMsg = null; $('#mReply').hidden = true; }
function msgBack() { if (!$('#mReply').hidden) { $('#mReply').hidden = true; msgActs(); } else closeMsg(); }
$('#mBack').onclick = msgBack;
function careOn() { return C.care && C.care.on; }
function renderCareBtns() {
  const box = $('#care'); box.textContent = '';
  if (careOn() && C.care.checkin.on) {
    const b = el('button', 'pill lg ' + (careSt.checkedIn ? 'done' : 'okbtn'));
    b.innerHTML = ICON_OK + '<span>' + (careSt.checkedIn ? 'Heute gemeldet' : 'Mir geht’s gut') + '</span>';

    };

    b.innerHTML = ICON_SOS + '<span>Hilfe<small>3 Sekunden halten</small></span><i class="sosring"></i>';

  }

/** a button that only acts when held for `ms` (a ring fills up meanwhile) */
function holdFor(b, ms, fn) {
  let t0 = 0, iv = 0;
  const ring = () => b.querySelector('.sosring');
  const stop = () => { clearInterval(iv); iv = 0; t0 = 0; ring().style.background = ''; b.classList.remove('holding'); };
  b.addEventListener('pointerdown', () => {
    t0 = Date.now(); b.classList.add('holding');
    iv = setInterval(() => {
      const f = Math.min(1, (Date.now() - t0) / ms);
      ring().style.background = 'conic-gradient(#fff ' + (f * 360) + 'deg, transparent 0)';
      if (f >= 1) { stop(); if (navigator.vibrate) navigator.vibrate([200, 100, 200]); fn(); }
    }, 40);
  });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(n => b.addEventListener(n, () => { if (iv) { stop(); toast('Für Hilfe den Knopf 3 Sekunden gedrückt halten.'); } }));
  b.addEventListener('click', e => e.preventDefault());
}
function startSos() {
  A.sos();
  const who = C.people.find(p => p.id === C.care.sos.call);
  say('Hilfe wird gerufen.');
  toast('Die Familie wird benachrichtigt' + (who ? '. ' + who.name + ' wird angerufen …' : '.'));
  if (who) setTimeout(() => A.call(who.number), 1500);
}

/* ---------- Lupe: the camera as a big magnifying glass ---------- */
let lupeStream = null, lupeZoom = 1, lupeLight = false;
async function openLupe() {
  if (!A.has('camera')) { pendingAfterPerm = openLupe; A.ask('camera'); return; }
  $('#lupe').classList.add('open');
  try {
    lupeStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false });
    const v = $('#lupeV'); v.srcObject = lupeStream; v.play();
    lupeZoom = 2; lupeLight = false; applyLupe();
  } catch (e) { toast('Die Kamera ließ sich nicht öffnen.'); closeLupe(); }
}
function lupeTrack() { return lupeStream && lupeStream.getVideoTracks()[0]; }
function applyLupe() {
  const t = lupeTrack(), caps = t && t.getCapabilities ? t.getCapabilities() : {};
  const v = $('#lupeV');
  if (caps.zoom) {
    const z = Math.max(caps.zoom.min, Math.min(caps.zoom.max, lupeZoom));
    t.applyConstraints({ advanced: [{ zoom: z }] }).catch(() => {});
    v.style.transform = '';
  } else v.style.transform = 'scale(' + lupeZoom + ')';
  if (caps.torch) t.applyConstraints({ advanced: [{ torch: lupeLight }] }).catch(() => {});
  $('#lupeZ').textContent = lupeZoom.toFixed(1).replace('.', ',') + '×';
  $('#lupeL').classList.toggle('on', lupeLight); $('#lupeL').setAttribute('aria-pressed', lupeLight);
  $('#lupeF').textContent = v.paused ? 'Weiter' : 'Anhalten';
}
function closeLupe() {
  $('#lupe').classList.remove('open');
  if (lupeStream) lupeStream.getTracks().forEach(t => t.stop());
  lupeStream = null;
}

/* ---------- Bilderrahmen: the newest photos, large ---------- */
let photoIds = [], photoIdx = 0, photoCache = new Map(), frameT = 0, viewIdx = -1;
function loadPhotos() {
  if (!C.frame) return;
  if (!A.has('photos')) { $('#frame').innerHTML = '<p class="framenote">Für den Bilderrahmen in der Einrichtung „Fotos erlauben“.</p>'; return; }
  A.photos(!!C.frameWA);
}
window.onPhotos = function (json) {
  try { photoIds = JSON.parse(json); } catch (e) { photoIds = []; }
  photoIdx = 0; showFrame();
  clearInterval(frameT); frameT = setInterval(() => { if (photoIds.length > 1 && !document.querySelector('.view.open')) { photoIdx = (photoIdx + 1) % Math.min(photoIds.length, 12); showFrame(); } }, 9000);
};
function getPhoto(id, size) {
  const k = id + '@' + size;
  if (photoCache.has(k)) return Promise.resolve(photoCache.get(k));
  return new Promise(res => { (photoWait[k] = photoWait[k] || []).push(res); if (photoWait[k].length === 1) A.photo(id, size); });
}
const photoWait = {};
window.onPhoto = function (id, data) {
  for (const k of Object.keys(photoWait)) if (k.startsWith(id + '@')) {
    const url = data ? blobUrl(data) : '';
    photoCache.set(k, url); photoWait[k].forEach(f => f(url)); delete photoWait[k];
  }
};
function showFrame() {
  const f = $('#frame');
  if (!photoIds.length) { f.innerHTML = '<p class="framenote">Noch keine Fotos auf dem Handy.</p>'; return; }
  const id = photoIds[photoIdx];
  getPhoto(id, 900).then(url => {
    if (photoIds[photoIdx] !== id) return;
    f.innerHTML = '';
    const b = el('button', 'framebtn'); b.setAttribute('aria-label', 'Fotos ansehen');
    b.style.backgroundImage = 'url("' + url + '")';
    b.onclick = () => openViewer(photoIdx);
    f.append(b);
  });
}
function openViewer(i) { viewIdx = i; $('#pview').classList.add('open'); showViewer(); }
function showViewer() {
  const id = photoIds[viewIdx];
  $('#pvCount').textContent = (viewIdx + 1) + ' von ' + photoIds.length;
  getPhoto(id, 1600).then(url => { if (photoIds[viewIdx] === id) $('#pvImg').style.backgroundImage = 'url("' + url + '")'; });
}
function stepViewer(d) { if (!photoIds.length) return; viewIdx = (viewIdx + d + photoIds.length) % photoIds.length; showViewer(); }
function closeViewer() { $('#pview').classList.remove('open'); viewIdx = -1; }

    if (t.dataset.addmed) add(t.dataset.addmed);
    else {
      openDlg('<h2>Eigene Erinnerung</h2><div class="field"><label for="medTxt">Text</label><input type="text" id="medTxt"></div><div class="row" style="justify-content:flex-end"><button class="btn" id="mtNo">Abbrechen</button><button class="btn pri" id="mtOk">Hinzufügen</button></div>');
      $('#mtNo').onclick = closeDlg; $('#mtOk').onclick = () => { const v = $('#medTxt').value.trim(); closeDlg(); add(v); };
    }
    return;
  }
  if (t.dataset.t && t.closest('[data-time]')) {
    const path = t.closest('[data-time]').dataset.time;
    const obj = path.startsWith('meds.') ? C.meds[+path.split('.')[1]] : C.care.checkin;
    const k = t.dataset.t;
    if (k === 'h+') obj.h = (obj.h + 1) % 24; else if (k === 'h-') obj.h = (obj.h + 23) % 24;
    else if (k === 'm+') obj.m = (obj.m + 10) % 60; else obj.m = (obj.m + 50) % 60;
    save(); renderSetup(); return;
  }
  if (t.dataset.after) { C.care.medNotify.after = Math.max(15, Math.min(240, C.care.medNotify.after + +t.dataset.after)); save(); renderSetup(); return; }
  switch (t.dataset.act) {
    case 'notes': A.notesAccess(); break;
    case 'appinfo': e.preventDefault(); A.appDetails(); break;
    case 'exact': A.allowExactAlarms(); break;
    case 'delmed': C.meds.splice(+t.dataset.i, 1); save(); renderSetup(); refreshCare(); break;
    case 'bigcalls': confirmDlg('Großer Start wird dann die Telefon-App des Handys: eingehende Anrufe zeigen einen großen, einfachen Bildschirm. Zurück geht es jederzeit unter „Anrufe“.', 'Einschalten', () => A.bigCalls()); break;
    case 'phoneback': A.defaultApps(); break;
    case 'careon':
      confirmDlg('Achtung: Wenn Sie die erweiterte Betreuung einrichten, kann dieses Handy von selbst SMS an Familienmitglieder senden oder sie anrufen, zum Beispiel beim Hilfe-Knopf oder wenn „Mir geht’s gut“ nicht gedrückt wurde. ' +
        'Dabei können SMS-Kosten entstehen. Bitte sprechen Sie das vorher mit den Familienmitgliedern ab, die Sie auswählen.', 'Verstanden, einrichten',
        () => { C.care = Object.assign(careDefaults(), C.care || {}, { on: true }); save(); renderSetup(); refreshCare(); });
      break;
    case 'careoff': C.care.on = false; save(); renderSetup(); refreshCare(); break;
  }
});
$('#setup').addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.copt) {
    const [a, b] = t.dataset.copt.split('.'); C.care[a][b] = t.checked;
    if (a === 'sos' && t.checked && !A.has('location')) A.ask('location');
    if (!A.has('sms')) A.ask('sms');
    save(); renderSetup(); refreshCare(); return;
  }
  if (t.dataset.pick) {
    const [a, b] = t.dataset.pick.split('.');
    if (t.type === 'radio') C.care[a][b] = t.value;
    else { const s = new Set(C.care[a][b] || []); t.checked ? s.add(t.value) : s.delete(t.value); C.care[a][b] = [...s]; }
    save(); return;
  }
  if (t.id === 'careName') { C.care.name = t.value.trim(); save(); }
});
function careDefaults() {
  return { on: false, name: '', checkin: { on: false, send: true, h: 12, m: 0, to: [] }, sos: { on: false, to: [], call: '' }, medNotify: { on: false, after: 60, to: [] } };
}

$('#lupeP').onclick = () => { lupeZoom = Math.min(8, lupeZoom + 0.5); applyLupe(); };
$('#lupeM').onclick = () => { lupeZoom = Math.max(1, lupeZoom - 0.5); applyLupe(); };
$('#lupeL').onclick = () => { lupeLight = !lupeLight; applyLupe(); };
$('#lupeF').onclick = () => { const v = $('#lupeV'); v.paused ? v.play() : v.pause(); applyLupe(); };
$('#lupeX').onclick = closeLupe;
$('#pvPrev').onclick = () => stepViewer(-1);
$('#pvNext').onclick = () => stepViewer(1);
$('#pvX').onclick = closeViewer;

/* ---------- messages ---------- */
let toastT = 0;
function toast(t) {
  const e = $('#toast'); e.textContent = t; e.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => e.classList.remove('show'), 2600);
}

/* ---------- Back and Home (called by the app) ---------- */
/** Back closes the top-most window. On the front page it does nothing, so nobody can leave it by accident. */
window.appBack = function () {
  if (document.documentElement.classList.contains('sizing')) { endSizing(); return true; }
  if ($('#dlg').classList.contains('open')) closeDlg();
  else if ($('#pin').classList.contains('open')) closePin();
  else if ($('#setup').classList.contains('open')) closeSetup();
  else if (curPerson) closePerson();
  else if ($('#mview').classList.contains('open')) msgBack();
  else if ($('#drawer').classList.contains('open')) closeDrawer();
  else if ($('#wview').classList.contains('open')) closeWidget();
  else if ($('#lupe').classList.contains('open')) closeLupe();
  else if ($('#pview').classList.contains('open')) closeViewer();
  return true;
};
/** Home (and leaving the screen): back to the front page; `all` closes the settings too */
window.goHome = function (all) {
  closePerson(); holdStop(); closeDrawer(); closeWidget(); closeLupe(); closeViewer();
  if ($('#dlg .menu')) closeDlg();
  if (all) { closePin(); if ($('#setup').classList.contains('open')) closeSetup(); }
  window.scrollTo(0, 0);
};

/** people without a photo get the one from their contact, found by phone number (unless "Kein Foto" was chosen) */
function findPhotos() {
  const need = C.people.filter(p => !p.photo && !p.noPhoto).map(p => ({ id: p.id, number: p.number }));
  if (need.length) A.findPhotos(JSON.stringify(need));
}
window.onContactPhoto = function (id, url) {
  const p = C.people.find(x => x.id === id);
  if (!p || p.photo || p.noPhoto || !url) return;
  p.photo = url;
  clearTimeout(photoT);
  photoT = setTimeout(() => {
    save(); renderHome();
    if ($('#setup').classList.contains('open') && !$('#dlg').classList.contains('open')) renderSetup();
  }, 400);
};
let photoT = 0;

/* the background picture (kept by the app as a file; '' = the phone's own wallpaper shows through) */
let bgUrl = '';
function setBackground(url) {
  bgUrl = url || '';
  const root = document.documentElement;
  root.classList.toggle('hasbg', !!bgUrl);
  root.style.setProperty('--bgimg', bgUrl ? 'url("' + blobUrl(bgUrl) + '")' : 'none');
  root.style.removeProperty('--bgsoft');
  if (!bgUrl) return;
  // drawn small and blurred once; scaled up it stays soft, and costs nothing while the person screen is open
  const img = new Image();
  img.onload = () => {
    const w = 90, h = Math.max(1, Math.round(w * img.height / img.width)), c = document.createElement('canvas');
    c.width = w; c.height = h;
    const x = c.getContext('2d'); x.filter = 'blur(4px) saturate(1.3)'; x.drawImage(img, -6, -6, w + 12, h + 12);
    c.toBlob(b => { if (b) root.style.setProperty('--bgsoft', 'url("' + URL.createObjectURL(b) + '")'); }, 'image/jpeg', 0.8);
  };
  img.src = blobUrl(bgUrl);
}
window.onBackground = function (url) {
  setBackground(url);
  if ($('#setup').classList.contains('open')) renderSetup();
  toast('Hintergrund gespeichert');
};
try { setBackground(A.getBackground()); } catch (e) {}

try { if (A.canBlur && !A.canBlur()) document.documentElement.classList.add('noblur'); } catch (e) {}
fixOrder();
applySize();
renderHome();
findPhotos();
LG.scan();
if (firstRun) { save(); openSetup(); }
</script>
</body>
